        interface_refs: ["IF-ATA36-BLEED", "IF-ATA21-20-PACK"]
      verification_plan:
        verification_methods: ["Test", "Analysis"]
        acceptance_criteria:
          - "Pressure regulation within specified tolerance"
          - "Transient response within acceptable limits"
        evidence_placeholders: ["TR-ATA21-10-PRESS-001", "AN-ATA21-10-PRESS-001"]
