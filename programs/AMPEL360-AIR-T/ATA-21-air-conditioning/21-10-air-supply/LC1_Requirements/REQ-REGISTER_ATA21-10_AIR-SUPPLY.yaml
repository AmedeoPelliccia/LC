  requirements:

    - requirement_id: "REQ-ATA21-10-0001"
      title: "Bleed air mass flow capacity"
      text: >
        The air supply subsystem shall deliver a minimum bleed air mass flow of X kg/s
        to downstream ECS consumers under all approved flight conditions.
      type: "Performance"
      level: "Subsystem"
      allocated_to_object_ids: ["ATA21-10-BleedSystem"]
      safety:
        safety_relevant: true
        classification: "Minor"
        derived_dal: "N/A"
        hazard_ids: []
      materials:
        material_applicability: "Yes"
        material_constraints: ["High-temperature alloys", "Corrosion-resistant"]
      interfaces:
        interface_refs: ["IF-ATA36-BLEED", "IF-ATA71-ENGINE", "IF-ATA21-20-PACK"]
      verification_plan:
        verification_methods: ["Test"]
        acceptance_criteria:
          - "Mass flow meets or exceeds specification at all flight phases"
          - "Flow stability within acceptable variance"
        evidence_placeholders: ["TR-ATA21-10-FLOW-001"]
      trace_hooks:
        LC2_design_ids: []
        LC3_analysis_ids: []
        LC4_test_ids: []
        LC5_moc_records: []
        LC6_docs: []
        LC7_disposal_refs: []

