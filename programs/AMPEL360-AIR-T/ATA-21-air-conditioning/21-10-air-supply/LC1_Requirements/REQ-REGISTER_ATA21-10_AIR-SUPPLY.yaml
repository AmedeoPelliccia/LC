    - requirement_id: "REQ-ATA21-10-0003"
      title: "Bleed air temperature limits"
      text: >
        The air supply subsystem shall ensure bleed air temperature does not exceed
        the maximum allowable limit at downstream delivery points, with automatic
        overheat protection.
      type: "Safety"
      level: "Subsystem"
      allocated_to_object_ids: ["ATA21-10-TempControl"]
      safety:
        safety_relevant: true
        classification: "Hazardous"
        derived_dal: "DAL-B"
        hazard_ids: ["HAZ-ATA21-10-0002", "HAZ-ATA21-10-0003"]
      materials:
        material_applicability: "Yes"
        material_constraints: ["High-temp rated", "Thermal insulation"]
      interfaces:
        interface_refs: ["IF-ATA71-ENGINE", "IF-ATA21-20-PACK", "IF-ATA46-CAUTION"]
      verification_plan:
        verification_methods: ["Test", "Analysis"]
        acceptance_criteria:
          - "Temperature never exceeds specified limit"
          - "Overheat detection and shutdown demonstrated"
        evidence_placeholders: ["TR-ATA21-10-TEMP-001", "AN-ATA21-10-TEMP-001"]
